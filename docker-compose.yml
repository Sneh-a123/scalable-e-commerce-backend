version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: nexora-mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - nexora-net

  # Redis In-Memory Cache
  redis:
    image: redis:7.2-alpine
    container_name: nexora-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - nexora-net

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/nexora_db
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: nexora_super_secret_jwt_key_2026_genz_saas
      JWT_REFRESH_SECRET: nexora_refresh_secret_jwt_key_2026_future
      ADMIN_EMAIL: admin@nexora.com
      ADMIN_PASSWORD: Admin@12345
      RAZORPAY_KEY_ID: rzp_test_nexora_mock_key
      RAZORPAY_KEY_SECRET: nexora_rzp_mock_secret_key_999
    ports:
      - '5000:5000'
    depends_on:
      - mongo
      - redis
    networks:
      - nexora-net

  # Frontend Client
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend
    networks:
      - nexora-net

networks:
  nexora-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
